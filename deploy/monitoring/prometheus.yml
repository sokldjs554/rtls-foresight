# Prometheus 스크레이프 설정 (docker compose 의 prometheus 서비스가 사용)
global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: foresight-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels: { service: rtls-foresight, env: compose }
