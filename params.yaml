# DVC 파이프라인 파라미터 (dvc.yaml 의 stage 들이 참조). Hydra 설정과 겹치는 값은 여기서 오버라이드로 넘긴다.
seed: 0
train: paper          # paper | fast | smoke
rtls:
  profile: full       # smoke | small | full — 충돌 경보 평가는 full(200 태그 × 12 h) 이어야 양성이 충분하다
  train_skip: 4
  d_safe: 1.0
  transfer_limit_scenes: 60000
  eval_every: 10
export:
  int8: true
