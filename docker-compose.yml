# 로컬 전체 토폴로지: 서빙 API + MLflow(서버, MinIO 아티팩트) + MinIO(S3 호환: DVC 원격·MLflow) + Redpanda(Kafka API)
#  + RTLS 재생 생산자 + 스트리밍 소비자.  docker compose up --build  →  http://localhost:8000/docs, :5000 (MLflow), :9001 (MinIO)
#
# 현장 배치와의 차이를 분명히 적어 둔다: 브로커 1노드·복제 없음, 인증 없음, 볼륨은 로컬. Confluent Cloud / AWS 로 옮길 때는
# deploy/terraform 과 docs/serving_streaming.md §6 을 본다.
name: rtls-foresight

x-common-env: &common-env
  FORESIGHT_ROOT: /app
  OMP_WAIT_POLICY: PASSIVE
  OMP_NUM_THREADS: "1"
  MLFLOW_DISABLE_TELEMETRY: "true"

services:
  api:
    build: { context: ., target: serve }
    image: rtls-foresight:serve
    environment:
      <<: *common-env
      FORESIGHT_BACKEND: ${FORESIGHT_BACKEND:-onnx}
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=2).status==200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }   # 1 스레드 서빙이 최선이다 — 확장은 워커/레플리카로

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
                  mc mb -p local/mlflow && mc mb -p local/dvc && echo buckets ready"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.1.0
    depends_on:
      minio-init: { condition: service_completed_successfully }
    # 공식 이미지에는 boto3 가 없어 S3(MinIO) 아티팩트를 못 쓴다 — 기동 시 설치한다 (별도 이미지를 만들 만큼의 일은 아니다)
    command: >
      sh -c "pip install -q boto3 &&
             mlflow server --host 0.0.0.0 --port 5000
             --backend-store-uri sqlite:///mlflow/mlflow.db
             --artifacts-destination s3://mlflow/"
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      MLFLOW_DISABLE_TELEMETRY: "true"
    ports: ["5000:5000"]
    volumes: ["mlflow-data:/mlflow"]

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    command: >-
      redpanda start --overprovisioned --smp 1 --memory 512M --reserve-memory 0M --node-id 0 --check=false
      --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports: ["9092:9092"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 12

  replay:
    # RTLS 장면(npz 또는 2.5 Hz parquet)을 Kafka 토픽으로 10배속 재생하는 생산자. 실제 현장에서는 UWB 엔진 → Kafka Connect 가 이 자리다.
    build: { context: ., target: train }
    image: rtls-foresight:train
    profiles: ["stream"]
    depends_on:
      redpanda: { condition: service_healthy }
    environment: { <<: *common-env }
    volumes: ["./data:/app/data:ro"]
    entrypoint: ["foresight"]
    command: ["stream", "--mode", "produce", "--bootstrap", "redpanda:29092",
              "--topic", "rtls.positions", "--replay-file", "data/processed/rtls/test.npz", "--speed", "10", "--max-seconds", "300"]

  consumer:
    # 토픽을 읽어 구역별 예측 → 충돌 위험 → 경보 토픽. 파티션 수만큼 레플리카를 늘리면 수평 확장된다.
    image: rtls-foresight:serve
    profiles: ["stream"]
    depends_on:
      redpanda: { condition: service_healthy }
      api: { condition: service_healthy }
    environment: { <<: *common-env }
    entrypoint: ["foresight"]
    command: ["stream", "--source", "kafka", "--sink", "kafka", "--bootstrap", "redpanda:29092",
              "--topic", "rtls.positions", "--alerts-topic", "rtls.alerts", "--backend", "onnx", "--max-seconds", "300"]

  # --- 관측성: Prometheus 가 api:/metrics 를 긁고 Grafana 가 프로비저닝된 대시보드로 보여 준다 (docs/runbook.md)
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]
    depends_on: [api]

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  minio-data:
  mlflow-data:
