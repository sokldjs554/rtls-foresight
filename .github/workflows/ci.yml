name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORESIGHT_ROOT: ${{ github.workspace }}
  MLFLOW_DISABLE_TELEMETRY: "true"
  MLFLOW_DISABLE_AGENT_HINT: "1"
  OMP_WAIT_POLICY: PASSIVE
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install ruff mypy
      - run: ruff check src tests scripts tools
      - run: ruff format --check src tests scripts tools
      - name: mypy (src 전체, 0 오류 유지)
        run: pip install -e . && mypy src/foresight

  test:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}", cache: pip }
      - name: Install (CPU torch — CUDA 휠 2.5 GB 를 받을 이유가 없다)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[serve,dev]"
      - name: Unit tests (공식 로더 동일성·골든 출력·ONNX 패리티·API·스트림)
        run: pytest -q -p no:warnings
      - name: Smoke pipeline (다운로드 → 준비 → 2 epoch 학습 → 시뮬레이션 → RTLS 준비 → 내보내기 → 빠른 벤치 → RTLS 평가)
        if: matrix.python == '3.11'
        run: |
          foresight download --splits eth
          foresight prepare --splits eth
          foresight train dataset=eth train=smoke dataset.limit_scenes=64 eval.k=5 eval.seeds=[0] out_dir=results/smoke run_name=ci-smoke
          foresight simulate --profile smoke
          foresight prepare-rtls --in-dir data/rtls/smoke/raw --out-dir data/processed/rtls
          foresight export --ckpt results/smoke/ci-smoke/best.pth --out artifacts/onnx-smoke
          foresight benchmark --quick --ckpt results/smoke/ci-smoke/best.pth --onnx-dir artifacts/onnx-smoke --out results/benchmark-smoke.json
          foresight evaluate-rtls --ckpts results/smoke/ci-smoke/best.pth --names ci-smoke --data-dir data/processed/rtls --seeds 0 --k 5 --max-scenes 200 --out results/smoke/rtls_transfer.json --collision-out results/smoke/collision_eval.json --figure results/smoke/collision_pr.png
          foresight demo --ckpt results/smoke/ci-smoke/best.pth --data-dir data/processed/rtls --out-dir results/smoke/demo --gif results/smoke/demo.gif --gif-frames 5 --seconds 20
      - name: README 수치·표가 results 와 일치하는지
        if: matrix.python == '3.11'
        run: python tools/check_readme_numbers.py --check && python scripts/sync_tables.py --check
      - uses: actions/upload-artifact@v4
        if: always() && matrix.python == '3.11'
        with:
          name: smoke-results
          path: |
            results/smoke/
            results/benchmark-smoke.json
          if-no-files-found: ignore

  docker:
    name: serving image
    runs-on: ubuntu-latest
    needs: [lint]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR (main 브랜치만 push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: serve
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docs:
    name: mkdocs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install mkdocs mkdocs-material
      - run: mkdocs build --strict

  pages:
    name: GitHub Pages (docs + 브라우저 데모)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [docs]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install mkdocs mkdocs-material
      - name: mkdocs gh-deploy (gh-pages 브랜치; 저장소 Settings → Pages 에서 gh-pages 를 소스로)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdocs gh-deploy --force --no-history
